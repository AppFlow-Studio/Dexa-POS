name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 1.2.0)"
        required: true
      force_update:
        description: "Force update (hide Skip button)"
        type: boolean
        default: false
      release_notes:
        description: "Release notes shown in the update modal"
        required: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: OTA update via EAS — runs on every push to main
  # ---------------------------------------------------------------------------
  ota-update:
    name: EAS OTA Update
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish OTA update
        run: npx eas-cli update --branch production --message "${{ github.event.head_commit.message }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job 2: Build APK + deploy to Bunny CDN — manual trigger only
  # ---------------------------------------------------------------------------
  build-and-release-apk:
    name: Build APK & Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK via EAS
        id: eas_build
        run: |
          npx eas-cli build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            --json \
            > eas_build_output.json
          cat eas_build_output.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Extract APK download URL
        id: extract_url
        run: |
          # eas build --json outputs an array; grab the first artifact URL
          APK_URL=$(npx eas-cli build:list --platform android --limit 1 --json \
            | python3 -c "import sys,json; builds=json.load(sys.stdin); print(builds[0]['artifacts']['buildUrl'])")
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        run: |
          curl -L "${{ steps.extract_url.outputs.apk_url }}" -o dexa-pos-${{ inputs.version }}.apk

      - name: Upload APK to Bunny CDN
        run: |
          curl -X PUT \
            -H "AccessKey: ${{ secrets.BUNNY_STORAGE_KEY }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @dexa-pos-${{ inputs.version }}.apk \
            "https://storage.bunnycdn.com/dexa-pos-uploads/releases/dexa-pos-${{ inputs.version }}.apk"

      - name: Build and upload version.json
        run: |
          # Derive build number from version (strip dots, use as integer)
          BUILD_NUMBER=$(echo "${{ inputs.version }}" | tr -d '.' | sed 's/^0*//')

          cat > version.json << EOF
          {
            "version": "${{ inputs.version }}",
            "buildNumber": $BUILD_NUMBER,
            "apkUrl": "https://dexa-pos-uploads.b-cdn.net/releases/dexa-pos-${{ inputs.version }}.apk",
            "releaseNotes": "${{ inputs.release_notes }}",
            "forceUpdate": ${{ inputs.force_update }}
          }
          EOF

          curl -X PUT \
            -H "AccessKey: ${{ secrets.BUNNY_STORAGE_KEY }}" \
            -H "Content-Type: application/json" \
            --data-binary @version.json \
            "https://storage.bunnycdn.com/dexa-pos-uploads/releases/version.json"

      - name: Done
        run: |
          echo "Released version ${{ inputs.version }} to Bunny CDN."
          echo "APK: https://dexa-pos-uploads.b-cdn.net/releases/dexa-pos-${{ inputs.version }}.apk"
          echo "Manifest: https://dexa-pos-uploads.b-cdn.net/releases/version.json"
