name: DEXA POS Deploy

on:
  push:
    branches: [main] # triggers OTA update on every merge to main
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for the APK (e.g. 1.4.2)"
        required: true
        type: string

jobs:
  # ─────────────────────────────────────────────
  # Layer 1: OTA JS update — runs on every push to main.
  # Covers ~80% of all fixes. No APK install required by merchant.
  # ─────────────────────────────────────────────
  ota-update:
    name: Push OTA Update
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update to production channel
        run: |
          eas update \
            --branch production \
            --message "${{ github.event.head_commit.message }}" \
            --non-interactive

  # ─────────────────────────────────────────────
  # Layer 2: Native APK build — triggered manually only.
  # Use this when a native dependency, permission, or SDK changes.
  # After the build, the APK is uploaded to Bunny CDN and version.json
  # is updated so the in-app updater prompts merchants automatically.
  # ─────────────────────────────────────────────
  build-apk:
    name: Build & Upload APK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK via EAS
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --output ./build/dexa-pos.apk

      # FIX: Use --upload-file (streams raw binary as Bunny requires).
      # FIX: Set Content-Type to the Android APK MIME type so Bunny serves
      # it correctly and Android download manager accepts the install intent.
      - name: Upload APK to Bunny CDN
        run: |
          curl -X PUT \
            "https://storage.bunnycdn.com/${{ secrets.BUNNY_STORAGE_ZONE }}/releases/dexa-pos-${{ inputs.version }}.apk" \
            -H "AccessKey: ${{ secrets.BUNNY_STORAGE_KEY }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --upload-file ./build/dexa-pos.apk

      # Update version.json so the in-app native updater picks up the new APK.
      # forceUpdate: true will block the app until the merchant installs.
      # Set to false for non-critical releases.
      - name: Update version manifest on Bunny CDN
        env:
          VERSION: ${{ inputs.version }}
          BUNNY_CDN_HOSTNAME: ${{ secrets.BUNNY_CDN_HOSTNAME }}
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_KEY: ${{ secrets.BUNNY_STORAGE_KEY }}
        run: |
          MANIFEST=$(jq -n \
            --arg version "$VERSION" \
            --arg apkUrl "https://$BUNNY_CDN_HOSTNAME/releases/dexa-pos-$VERSION.apk" \
            --arg releaseNotes "${{ github.event.inputs.version }} release" \
            '{
              version: $version,
              buildNumber: (now | floor),
              apkUrl: $apkUrl,
              releaseNotes: $releaseNotes,
              forceUpdate: false
            }')

          echo "$MANIFEST" | curl -X PUT \
            "https://storage.bunnycdn.com/$BUNNY_STORAGE_ZONE/releases/version.json" \
            -H "AccessKey: $BUNNY_STORAGE_KEY" \
            -H "Content-Type: application/json" \
            --upload-file -

      - name: Print CDN URLs
        run: |
          echo "APK URL: https://${{ secrets.BUNNY_CDN_HOSTNAME }}/releases/dexa-pos-${{ inputs.version }}.apk"
          echo "Manifest: https://${{ secrets.BUNNY_CDN_HOSTNAME }}/releases/version.json"