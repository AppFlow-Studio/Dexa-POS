plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

android {
  namespace "expo.modules.castlesusb"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // USB Serial library — handles CDC ACM for Castles hardware
  implementation 'com.github.mik3y:usb-serial-for-android:3.7.3'
}
